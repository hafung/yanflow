name: Windows package

on:
  push:
    branches: ['main', 'refactor/windows-native-cpp']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  YANFLOW_SKIP_ASR_SMOKE: 1

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Restore speech resources
        uses: actions/cache@v4
        with:
          path: build/deps/yanflow
          key: yanflow-speech-v1-${{ runner.os }}

      - name: Build and smoke-test portable package
        shell: cmd
        run: build\windows\build-yanflow.cmd

      - name: Verify worker startup and protocol handshake
        shell: cmd
        run: |
          call build\windows\test-yanflow-worker.cmd -Iterations 0
          if errorlevel 1 exit /b %errorlevel%

      - name: Verify native imports and extracted portable package
        shell: cmd
        run: build\windows\test-yanflow-native.cmd

      - name: Create release archive
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { $env:GITHUB_SHA.Substring(0, 8) }
          $archive = "YanFlow-$version-windows-x64.zip"
          Compress-Archive -Path "build\artifacts\yanflow-windows-x64\*" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -Encoding ascii SHA256SUMS
          "YANFLOW_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: YanFlow-windows-x64
          path: |
            YanFlow-*-windows-x64.zip
            SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "$env:YANFLOW_ARCHIVE" SHA256SUMS --verify-tag --generate-notes --title "YanFlow $env:GITHUB_REF_NAME"
